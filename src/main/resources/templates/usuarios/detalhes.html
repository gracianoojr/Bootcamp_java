<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Usuário</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="text-center mb-4">
        <h1 class="details-page-title mb-1">Detalhes do usuário</h1>
        <p class="details-page-subtitle mb-0">
            Visualize as informações cadastradas do usuário.
        </p>
    </div>
    <div class="card details-card">
        <div class="details-header">
            <div class="d-flex flex-column flex-md-row align-items-center align-items-md-start gap-3">
                <div class="avatar-circle">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="text-center text-md-start">
                    <h2 class="mb-1 fw-bold" th:text="${usuario.nome}"></h2>
                    <div class="mb-1">
                        <i class="bi bi-envelope me-1"></i>
                        <span th:text="${usuario.email}"></span>
                    </div>
                    <span class="badge-id">
                        <i class="bi bi-hash me-1"></i>
                        ID <span th:text="${usuario.id}"></span>
                    </span>
                </div>
            </div>
        </div>
        <div class="details-body">
            <div class="section-title">
                <i class="bi bi-info-circle me-2"></i>Informações cadastradas
            </div>

            <div class="row g-3">
                <div class="col-md-4">
                    <div class="info-card">
                        <div class="info-label">ID</div>
                        <div class="info-value" th:text="${usuario.id}"></div>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="info-card">
                        <div class="info-label">Nome</div>
                        <div class="info-value" th:text="${usuario.nome}"></div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="info-card">
                        <div class="info-label">Email</div>
                        <div class="info-value" th:text="${usuario.email}"></div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="info-card">
                        <div class="info-label">Número</div>
                        <div class="info-value" th:text="${usuario.numero}"></div>
                    </div>
                </div>
            </div>
            <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end mt-4">
                <a th:href="@{/usuarios-view}" class="btn btn-outline-secondary btn-custom">
                    <i class="bi bi-arrow-left me-1"></i>
                    Voltar
                </a>

                <a th:href="@{/usuarios-view/{id}/editar(id=${usuario.id})}" class="btn btn-warning btn-custom">
                    <i class="bi bi-pencil me-1"></i>
                    Editar usuário
                </a>
            </div>
        </div>
    </div>
</div>
</body>
<style>
    body {
        background: #f4f6f9;
    }

    .details-page-title {
        font-weight: 700;
        color: #1f2937;
    }

    .details-page-subtitle {
        color: #6b7280;
    }

    .details-card {
        max-width: 820px;
        margin: 0 auto;
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        overflow: hidden;
    }

    .details-header {
        background: linear-gradient(135deg, #0d6efd, #3b82f6);
        color: white;
        padding: 2rem;
    }

    .avatar-circle {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
    }

    .details-body {
        padding: 2rem;
    }

    .info-card {
        background: #f8fafc;
        border: 1px solid #e9ecef;
        border-radius: 16px;
        padding: 1rem 1.2rem;
        height: 100%;
    }

    .info-label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 0.35rem;
    }

    .info-value {
        font-size: 1rem;
        font-weight: 600;
        color: #1f2937;
        word-break: break-word;
    }

    .badge-id {
        background-color: rgba(255, 255, 255, 0.18);
        color: white;
        border-radius: 999px;
        padding: 0.45rem 0.85rem;
        font-weight: 600;
        display: inline-block;
        margin-top: 0.5rem;
    }

    .section-title {
        font-size: 1rem;
        font-weight: 700;
        color: #111827;
        margin-bottom: 1rem;
    }

    .btn-custom {
        border-radius: 12px;
        padding: 0.7rem 1.2rem;
        font-weight: 600;
    }
</style>
</html>
