<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicao} ? 'Editar Usuário' : 'Novo Usuário'"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="text-center mb-4">
        <h1 class="form-page-title mb-1" th:text="${modoEdicao} ? 'Editar usuário' : 'Cadastrar usuário'"></h1>
        <p class="form-page-subtitle mb-0"
           th:text="${modoEdicao} ? 'Atualize as informações do usuário.' : 'Preencha os dados para cadastrar um novo usuário.'">
        </p>
    </div>
    <div class="card form-card">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center"
                     style="width: 52px; height: 52px;">
                    <i class="bi bi-person-fill fs-4"></i>
                </div>
                <div>
                    <div class="section-title">Informações do usuário</div>
                    <div class="section-subtitle">Campos obrigatórios devem ser preenchidos corretamente.</div>
                </div>
            </div>
            <div th:if="${erro}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${erro}"></span>
            </div>
            <form th:action="${modoEdicao} ? @{/usuarios-view/{id}(id=${usuarioId})} : @{/usuarios-view}"
                  th:object="${usuario}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text"
                               class="form-control"
                               th:field="*{nome}"
                               placeholder="Digite o nome completo">
                    </div>
                    <div class="text-danger mt-2 field-error"
                         th:if="${#fields.hasErrors('nome')}"
                         th:errors="*{nome}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email"
                               class="form-control"
                               th:field="*{email}"
                               placeholder="Digite o email">
                    </div>
                    <div class="text-danger mt-2 field-error"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Número</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-telephone"></i>
                        </span>
                        <input type="text"
                               class="form-control"
                               th:field="*{numero}"
                               placeholder="Digite o número">
                    </div>
                    <div class="text-danger mt-2 field-error"
                         th:if="${#fields.hasErrors('numero')}"
                         th:errors="*{numero}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password"
                               class="form-control"
                               th:field="*{senha}"
                               placeholder="Digite a senha">
                    </div>

                    <div th:if="${modoEdicao}" class="hint-box mt-3">
                        <i class="bi bi-info-circle me-1"></i>
                        Preencha somente se quiser alterar a senha atual.
                    </div>

                    <div class="text-danger mt-2 field-error"
                         th:if="${#fields.hasErrors('senha')}"
                         th:errors="*{senha}"></div>
                </div>

                <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end mt-4">
                    <a th:href="@{/usuarios-view}" class="btn btn-outline-secondary btn-secondary-custom">
                        <i class="bi bi-arrow-left me-1"></i>
                        Voltar
                    </a>

                    <button type="submit" class="btn btn-success btn-main">
                        <i class="bi bi-check-lg me-1"></i>
                        <span th:text="${modoEdicao} ? 'Atualizar usuário' : 'Salvar usuário'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
<style>
    body {
        background: #f4f6f9;
    }
    .form-page-title {
        font-weight: 700;
        color: #1f2937;
    }
    .form-page-subtitle {
        color: #6b7280;
    }
    .form-card {
        max-width: 760px;
        margin: 0 auto;
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    .form-label {
        font-weight: 600;
        color: #374151;
        margin-bottom: 0.5rem;
    }

    .input-group-text {
        border-radius: 12px 0 0 12px;
        background: #f8f9fa;
        border-right: none;
    }

    .form-control {
        border-radius: 0 12px 12px 0;
        padding: 0.75rem 0.95rem;
    }

    .input-group .form-control {
        border-left: none;
    }

    .form-control:focus {
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.12);
        border-color: #86b7fe;
    }

    .section-title {
        font-size: 1rem;
        font-weight: 700;
        color: #111827;
    }

    .section-subtitle {
        font-size: 0.92rem;
        color: #6b7280;
    }

    .hint-box {
        background: #fff8e1;
        border: 1px solid #ffe69c;
        color: #7a5d00;
        border-radius: 12px;
        padding: 0.85rem 1rem;
        font-size: 0.92rem;
    }

    .btn-main {
        border-radius: 12px;
        padding: 0.7rem 1.2rem;
        font-weight: 600;
    }

    .btn-secondary-custom {
        border-radius: 12px;
        padding: 0.7rem 1.2rem;
        font-weight: 600;
    }

    .alert {
        border-radius: 12px;
    }

    .field-error {
        font-size: 0.9rem;
    }
</style>
</html>
